<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 Signal Lost | HARIS</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#030303" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000000;
        --surface: #111111;
        --line: rgba(245, 245, 247, 0.14);
        --text: #f5f5f7;
        --muted: #86868b;
        --accent: #0071e3;
        --danger: #ff3b30;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Animated 3D Grid Background */
      .bg-grid {
        position: absolute;
        inset: -50%;
        background-image: 
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 50px 50px;
        transform: perspective(600px) rotateX(60deg) translateY(-100px) translateZ(-200px);
        animation: gridMove 15s linear infinite;
        opacity: 0.4;
        z-index: 0;
        pointer-events: none;
      }

      .bg-fade {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 20%, var(--bg) 80%);
        z-index: 1;
        pointer-events: none;
      }

      @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 0 500px; }
      }

      .top-nav {
        display: flex;
        justify-content: flex-start;
        padding: 2.5rem 3.5rem;
        z-index: 10;
        position: relative;
      }

      .logo-text {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        text-decoration: none;
        color: var(--text);
        position: relative;
      }
      
      .logo-text::after {
        content: '';
        position: absolute;
        right: -14px;
        top: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulseBlue 2s infinite;
      }

      @keyframes pulseBlue {
        0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(0, 113, 227, 0.8); }
        50% { opacity: 0.2; box-shadow: none; }
      }

      .main-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 5;
        padding: 0 2rem;
      }

      .error-container {
        position: relative;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
        padding: 4rem;
      }

      /* Bounding Box Scanner */
      .scanner-box {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 2px solid rgba(0, 113, 227, 0);
        pointer-events: none;
        z-index: -1;
      }

      .scanner-box::before, .scanner-box::after,
      .scanner-box span::before, .scanner-box span::after {
        content: '';
        position: absolute;
        width: 40px;
        height: 40px;
        border-color: rgba(0, 113, 227, 0.8);
        border-style: solid;
        animation: bracketPulse 3s infinite alternate ease-in-out;
      }

      .scanner-box::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
      .scanner-box::after { top: 0; right: 0; border-width: 2px 2px 0 0; }
      .scanner-box span::before { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
      .scanner-box span::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

      @keyframes bracketPulse {
        0% { transform: scale(0.95); opacity: 0.3; }
        100% { transform: scale(1.05); opacity: 1; }
      }

      .status-pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(0, 113, 227, 0.1);
        padding: 0.4rem 1rem;
        border-radius: 99px;
        border: 1px solid rgba(0, 113, 227, 0.2);
      }

      .hero-404 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(8rem, 20vw, 16rem);
        font-weight: 700;
        line-height: 0.85;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #ffffff 0%, #86868b 100%);
        -webkit-background-clip: text;
        color: transparent;
        position: relative;
      }

      .hero-404::before {
        content: "404";
        position: absolute;
        left: -4px;
        text-shadow: 2px 0 rgba(0, 113, 227, 0.5);
        top: 0;
        color: transparent;
        background: transparent;
        opacity: 0;
        animation: glitchEffect 4s infinite linear;
      }

      @keyframes glitchEffect {
        0%, 5% { opacity: 0; transform: translate(0, 0); }
        5.5% { opacity: 1; transform: translate(-4px, 2px); clip-path: polygon(0 20%, 100% 20%, 100% 30%, 0 30%); }
        6% { opacity: 1; transform: translate(4px, -2px); clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); }
        6.5%, 100% { opacity: 0; transform: translate(0, 0); }
      }

      .desc-text {
        color: var(--muted);
        max-width: 420px;
        margin: 0.5rem 0 2.5rem;
        line-height: 1.6;
        font-size: 1.05rem;
      }

      .btn-primary {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 2rem;
        background: var(--text);
        color: var(--bg);
        text-decoration: none;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        background: #ffffff;
      }

      .btn-primary::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
        animation: shine 4s infinite;
      }

      @keyframes shine {
        0%, 60% { left: -100%; }
        80%, 100% { left: 100%; }
      }

      /* CRT Scanline Overlay */
      .scanlines {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.15) 51%);
        background-size: 100% 4px;
        z-index: 100;
        pointer-events: none;
      }

      @media (max-width: 768px) {
        .top-nav { padding: 2rem; }
        .error-container { padding: 2rem; }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-fade"></div>
    <div class="scanlines"></div>

    <nav class="top-nav">
      <a href="/HARIS/" class="logo-text">HARIS</a>
    </nav>
    
    <main class="main-content">
      <div class="error-container">
        <div class="scanner-box"><span></span></div>
        <div class="status-pill">Trace Lost</div>
        <h1 class="hero-404">404</h1>
        <p class="desc-text">
          The requested footage or system node cannot be located. The target may have gone off-grid.
        </p>
        <a href="/HARIS/" class="btn-primary">
          REINITIALIZE SYSTEM
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
